<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memuat Undangan - UNDIGITAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b1a30] text-white min-h-screen flex items-center justify-center p-6">
<div class="text-center">
<p id="msg" class="text-sm text-slate-300">Memuat undangan...</p>
</div>
<script>
const sb = window.supabase.createClient('https://nrotipuxmfbiqvzolzox.supabase.co','sb_publishable_aWyIwLYXvHDgHbTYKDnVjA_54uijLKx');
(async () => {
const q = new URLSearchParams(window.location.search);
// Slug dari ?slug= (mode lama) ATAU dari path /u/slug (mode rewrite baru)
let slug = ((q.get('slug') || q.get('event') || '').trim());
if (!slug) {
const m = window.location.pathname.match(/\/u\/([^\/?#]+)/);
if (m) {
try { slug = decodeURIComponent(m[1]); } catch (e) { slug = m[1]; }
slug = slug.trim();
}
}
if (!slug) { document.getElementById('msg').textContent = 'Slug undangan tidak ada (cek /u/slug).'; return; }
const { data, error } = await sb.from('events').select('template').eq('slug', slug).single();
if (error || !data) { document.getElementById('msg').textContent = 'Undangan tidak ditemukan: /u/' + slug; return; }
const file = '/code.html';
// Teruskan SEMUA parameter (?kpd=, ?to=, dll) ke halaman template
const fwd = new URLSearchParams(window.location.search);
fwd.delete('slug');
fwd.set('event', slug);
window.location.href = file + '?' + fwd.toString();
})();
</script>
</body>
</html>
