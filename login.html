<!DOCTYPE html>
<html class="scroll-smooth" lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Masuk - UNDIGITAL Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1a30; }
  .font-esthetic { font-family: 'Great Vibes', cursive; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 text-center">
  <h1 class="font-esthetic text-4xl text-[#F70063] mb-1">UNDIGITAL</h1>
  <p class="text-sm text-slate-500 mb-6">Masuk ke Dashboard Undangan</p>
  <div id="status" class="hidden text-xs mb-4 p-3 rounded-xl"></div>
  <!-- Form Email: Masuk -->
  <form id="form-login" onsubmit="loginEmail(event)" class="space-y-3 text-left">
    <div>
      <label class="text-xs font-semibold text-slate-700 block mb-1">Email</label>
      <input id="login-email" type="email" required="" placeholder="nama@email.com" class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#2391FF] focus:ring-1 focus:ring-[#2391FF]"/>
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-700 block mb-1">Password</label>
      <input id="login-pass" type="password" required="" minlength="6" placeholder="Minimal 6 karakter" class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#2391FF] focus:ring-1 focus:ring-[#2391FF]"/>
    </div>
    <button type="submit" class="w-full bg-[#2391FF] hover:bg-[#1875d6] text-white font-semibold text-sm py-3 rounded-2xl shadow transition">
      <i class="fa-solid fa-right-to-bracket mr-1"></i> Masuk
    </button>
  </form>
  <div class="flex items-center gap-3 my-4">
    <hr class="flex-1 border-slate-200"/><span class="text-[11px] text-slate-400">belum punya akun?</span><hr class="flex-1 border-slate-200"/>
  </div>
  <!-- Form Email: Daftar -->
  <form id="form-register" onsubmit="registerEmail(event)" class="space-y-3 text-left">
    <div>
      <label class="text-xs font-semibold text-slate-700 block mb-1">Email baru</label>
      <input id="reg-email" type="email" required="" placeholder="nama@email.com" class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#F70063] focus:ring-1 focus:ring-[#F70063]"/>
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-700 block mb-1">Buat Password</label>
      <input id="reg-pass" type="password" required="" minlength="6" placeholder="Minimal 6 karakter" class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#F70063] focus:ring-1 focus:ring-[#F70063]"/>
    </div>
    <button type="submit" class="w-full bg-[#F70063] hover:bg-[#d60055] text-white font-semibold text-sm py-3 rounded-2xl shadow transition">
      <i class="fa-solid fa-user-plus mr-1"></i> Daftar Akun Baru
    </button>
  </form>
  <button id="btn-google" style="display:none" onclick="loginGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 hover:border-[#2391FF] hover:shadow-lg text-slate-700 font-semibold text-sm py-3.5 px-6 rounded-2xl transition">
    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
    <span>Masuk dengan Google</span>
  </button>
  <p class="text-[11px] text-slate-400 mt-6">Admin &amp; pelanggan terdaftar saja.<br/>Belum punya akses? Hubungi admin UNDIGITAL.</p>
  <a href="/" class="inline-block mt-4 text-xs text-[#2391FF] font-semibold hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Undangan</a>
</div>
<script>
  const SUPABASE_URL = 'https://nrotipuxmfbiqvzolzox.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_aWyIwLYXvHDgHbTYKDnVjA_54uijLKx';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showStatus(msg, isError) {
    const el = document.getElementById('status');
    el.classList.remove('hidden');
    el.className = 'text-xs mb-4 p-3 rounded-xl ' + (isError ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-sky-50 text-sky-700 border border-sky-200');
    el.textContent = msg;
  }

  async function loginEmail(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;
    showStatus('Memeriksa akun...', false);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showStatus('Gagal masuk: ' + error.message, true); return; }
    showStatus('Berhasil masuk! Mengalihkan...', false);
    window.location.href = '/dashboard.html';
  }

  async function registerEmail(e) {
    e.preventDefault();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-pass').value;
    showStatus('Mendaftarkan akun...', false);
    const { error } = await sb.auth.signUp({ email, password });
    if (error) { showStatus('Gagal daftar: ' + error.message, true); return; }
    showStatus('Akun terdaftar! Silakan masuk dengan email & password di atas.', false);
    document.getElementById('login-email').value = email;
    e.target.reset();
  }

  // Kalau sudah login, langsung ke dashboard
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = '/dashboard.html';
  });
</script>
</body>
</html>
